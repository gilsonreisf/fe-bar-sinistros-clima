<!DOCTYPE html>
<!-- =========================================================================
     PRESENTATION — just open this file in a browser.
     No server, no build. Slides live in slides/*.js and are listed in
     slides/manifest.js. To add a slide: create slides/NN-name.js (copy an
     existing one) and add its filename to slides/manifest.js.
     ========================================================================= -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regulação inteligente de sinistros em eventos climáticos</title>
<!-- Favicon: the official Databricks mark in resources/. -->
<link rel="icon" href="resources/databricks-icon.svg">

<!-- Brand fonts. Self-hosted fallback FIRST (see assets/fonts.css for why the
     order matters), then the Google Fonts CDN — online the CDN wins, offline
     the deck falls back to the bundled DM Sans / DM Mono instead of a system font. -->
<link rel="stylesheet" href="assets/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ===========================  TOOLBAR  =============================== -->
<div class="toolbar">
  <div class="brand"><img class="mark" src="resources/databricks-icon.svg" alt="Databricks"> Sinistros climáticos</div>
  <div class="spacer"></div>
  <button class="tbtn" onclick="prev()">‹ Prev</button>
  <span class="counter"><span id="cur">1</span> / <span id="total">1</span></span>
  <button class="tbtn" onclick="next()">Next ›</button>
  <button class="tbtn" id="gridBtn" onclick="toggleGrid()"><svg class="tbtn-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>Overview</button>
  <button class="tbtn" onclick="toggleNotes()"><svg class="tbtn-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 9.5h8M8 12.5h5"/></svg>Notes</button>
  <button class="tbtn" id="laserBtn" onclick="toggleLaser()"><svg class="tbtn-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>Pointer</button>
  <input type="color" id="laserColor" class="laser-swatch" title="Pointer color" oninput="setLaserColor(this.value)">

  <button class="tbtn" onclick="openSpeaker()"><svg class="tbtn-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Speaker view</button>
  <button class="tbtn" onclick="fullscreen()"><svg class="tbtn-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Present</button>
  <div class="menu" id="exportMenu">
    <button class="tbtn primary" onclick="toggleMenu(event)" aria-haspopup="true">
      <svg class="tbtn-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M5 20h14"/></svg>
      Export <span class="caret">▾</span>
    </button>
    <div class="menu-list">
      <div class="menu-row">
        <button class="menu-parent" type="button">
          <svg class="mi-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M13 3v5h5"/></svg>
          <span>PDF</span><span class="sub-caret">‹</span>
        </button>
        <div class="submenu">
          <button onclick="exportPDF('all')">All slides</button>
          <button id="pdfSelected" onclick="exportPDF('selected')">Selected slides</button>
        </div>
      </div>
      <div class="menu-row">
        <button class="menu-parent" type="button">
          <svg class="mi-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 12.5h6M9 16h4"/></svg>
          <span>Google&nbsp;Slides</span><span class="sub-caret">‹</span>
        </button>
        <div class="submenu">
          <button onclick="openGSlides('all')">All slides</button>
          <button id="gsSelected" onclick="openGSlides('selected')">Selected slides</button>
        </div>
      </div>
      <div class="menu-row">
        <button class="menu-parent" type="button">
          <svg class="mi-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 12.5h6M9 16h4"/></svg>
          <span>PowerPoint&nbsp;(.pptx)</span><span class="sub-caret">‹</span>
        </button>
        <div class="submenu">
          <button onclick="openPptx('all')">All slides</button>
          <button id="pptxSelected" onclick="openPptx('selected')">Selected slides</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- =============================  DECK  =============================== -->
<div class="stage" id="stage">
<div class="deck" id="deck"></div><!-- slides injected here from slides/*.js -->
</div><!-- /stage -->

<div class="progress" id="progress"><span></span></div>

<div id="notesBar"><div class="nb-lbl">Speaker notes · slide <span id="nbNum">1</span></div><div class="nb-body" id="nbBody"></div></div>

<div class="grid-hint">
  <span class="gh-text">Click a slide to open it · Tick slides for “Export selected” · Press <b>G</b> to exit overview</span>
  <span class="gh-sel" role="group" aria-label="Selection">
    <span class="gh-count" id="selCount" aria-live="polite">0 of 0 selected</span>
    <button class="gh-btn" id="selAll" type="button">Select all</button>
    <button class="gh-btn" id="selNone" type="button">Select none</button>
  </span>
</div>
<div class="help" id="help">← → navigate · G overview · N notes · L pointer · S speaker view · F present · Export PDF → “Save as PDF”</div>

<script src="slides/manifest.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/gslides.js"></script>
</body>
</html>
