bundle:
  name: sinistros_clima

include:
  - recursos/*.yml

sync:
  exclude:
    - app/** # o app tem bundle próprio (app/databricks.yml; D-026)

variables:
  catalogo:
    description: Catálogo do Unity Catalog do projeto
    default: sinistros_clima
  prefixo_schema:
    description: Prefixo opcional dos schemas (vazio = sem prefixo)
    default: ""
  warehouse_id:
    description: ID do SQL Warehouse serverless
  pacote_python:
    description: Caminho do wheel do projeto no Volume de artefatos (saída de scripts/publicar_pacote.py)
  llm_lote:
    description: LLM do parecer em lote (o mais barato que passou no portão de qualidade da fase 4; D-023)
    default: databricks-claude-haiku-5-5  # mesma recomendação correta do Sonnet (95,1%) no dataset de avaliação

targets:
  dev:
    default: true
    workspace:
      profile: fe-bar
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalogo: fe_bar_sinistros_catalog  # catálogo criado pelo FEVM (D-016)
