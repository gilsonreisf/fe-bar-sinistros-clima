[project]
name = "fe-bar-sinistros-clima"
version = "0.1.0"
description = "FE Bar: regulação inteligente de sinistros em eventos climáticos (dados sintéticos e públicos)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "faker>=30",
    "reportlab>=4.2",
    "databricks-sdk>=0.81",
]

[dependency-groups]
dev = ["pytest>=8", "pypdf>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambiente", "src/regras", "src/dados_sinteticos"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["testes"]
