[project]
name = "fe-bar-sinistros-clima"
version = "0.1.0"
description = "FE Bar: regulação inteligente de sinistros em eventos climáticos (dados sintéticos e públicos)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "faker>=30",
    "reportlab>=4.2",
    "databricks-sdk>=0.81",
]

[dependency-groups]
dev = ["pytest>=8", "pypdf>=5"]
ml = [
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "mlflow>=3.1",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambiente", "src/regras", "src/ml", "src/dados_sinteticos"]

[tool.uv]
# ml: treino e modelo de suspeita (fase 3); sem shap, que exige numpy>=2 (D-021)
default-groups = ["dev", "ml"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["testes"]
